<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manish Acharya - Business Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="business-card" class="card-container">
        <!-- Profile Header -->
        <div class="header">
            <h1 id="user-name">Manish Acharya</h1>
            <p class="subtitle">Student at Seoul Theological University</p>
        </div>

        <!-- Personal & Business Details -->
        <div class="details-section">
            <div class="info-badge">
                <span class="label">Age:</span>
                <span class="value">20 years</span>
            </div>
            <div class="info-badge">
                <span class="label">Height:</span>
                <span class="value">5'10"</span>
            </div>
        </div>

        <div class="business-info">
            <h2>Manish Coding Training Center</h2>
            <p class="description">
                Empowering students with hands-on programming skills, web development, and tech foundation courses.
            </p>
        </div>

        <!-- Links & Deliverables Section -->
        <div class="actions">
            <!-- Replace YOUR_GOOGLE_DOC_LINK_HERE with your actual Google Doc link -->
            <a href="YOUR_GOOGLE_DOC_LINK_HERE" class="btn doc-btn" target="_blank" rel="noopener noreferrer">
                View Keyboard Shortcuts (Google Doc)
            </a>
            <a href="https://docs.google.com/document/d/1On_B1e7jZKTOTErZG7PCup0tItBmgHy70jRN_3RRHvU/edit?usp=drivesdk" target="_blank" rel="noopener noreferrer">
                GitHub Profile
            </a>
        </div>
    </div>

</body>
</html>
